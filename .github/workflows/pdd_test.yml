name: PDD test

on:
  push:
    branches:
      - main
    paths:
      - "run_pdd_once.py"
      - "run_gpu_pdd_once.py"
      - "scripts/setup_gpu_pd_env.sh"
      - "scripts/setup_pdd_envs.sh"
      - "requirements/pdd-*.txt"
      - "pyproject.toml"
      - "tests/torch_compile/e2e/v1/kv_connector/nixl_integration/toy_proxy_server.py"
      - "vllm_rbln/**"
      - ".github/workflows/pdd_test.yml"

permissions:
  contents: read

concurrency:
  group: pdd-test
  cancel-in-progress: false

env:
  # Report to the lab CI/CD HUD (https://sota.pusan.ac.kr/cicd/). HUD steps never change this CI's result.
  # gpu = GPU-only P/D baseline, pdd = CUDA prefill + RBLN decode.
  HUD_URL: ${{ vars.HUD_URL || 'https://sota.pusan.ac.kr/cicd' }}
  HUD_TOKEN: ${{ secrets.HUD_TOKEN }}
  HUD_EXPECTED_HW: gpu,pdd

jobs:
  gpu-baseline:
    name: GPU Baseline
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: "[HUD] Start"
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 20 "${HUD_URL}/client/hud_report.py" -o "${RUNNER_TEMP}/hud_report.py"
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          export RUN_ID=$($HUD start --commit "${GITHUB_SHA:0:7} (Run ${GITHUB_RUN_ATTEMPT})" --repo "${GITHUB_REPOSITORY}" \
            --expected-hw "${HUD_EXPECTED_HW}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")
          $HUD job lint gpu skipped
          $HUD job build gpu running
          $HUD job benchmark gpu skipped

      - name: Prepare environments
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          nvidia-smi
          bash scripts/setup_gpu_pd_env.sh

      - name: Run GPU baseline
        id: run
        shell: bash
        env:
          VLLM_LOGGING_LEVEL: DEBUG
        run: |
          set -euo pipefail
          python3 run_gpu_pdd_once.py \
            --ready-timeout-sec 1200 \
            --log-dir "${{ github.workspace }}/pdd_logs/gpu-baseline"

      - name: "[HUD] Report"
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          $HUD job build gpu "${{ steps.prepare.outcome }}"
          $HUD job correctness gpu "${{ steps.run.outcome }}"
          if [ "${{ steps.prepare.outcome }}" = failure ]; then
            $HUD failure gpu build --summary "Preparing the environments failed (see CI log)"
          elif [ "${{ steps.run.outcome }}" = failure ]; then
            $HUD failure gpu correctness --summary "GPU baseline run failed (see CI log)"
          fi
          $HUD finish "${{ job.status == 'success' && 'success' || 'failure' }}"

      - name: Upload GPU baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-baseline
          path: pdd_logs/gpu-baseline/
          if-no-files-found: warn
          retention-days: 14

  disaggregated-pdd:
    name: Disaggregated P/D
    needs: gpu-baseline
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: "[HUD] Start"
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 20 "${HUD_URL}/client/hud_report.py" -o "${RUNNER_TEMP}/hud_report.py"
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          export RUN_ID=$($HUD start --commit "${GITHUB_SHA:0:7} (Run ${GITHUB_RUN_ATTEMPT})" --repo "${GITHUB_REPOSITORY}" \
            --expected-hw "${HUD_EXPECTED_HW}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")
          $HUD job lint pdd skipped
          $HUD job build pdd running
          $HUD job benchmark pdd skipped

      - name: Prepare environments
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          rbln-stat
          bash scripts/setup_pdd_envs.sh
          .venvs/pdd-decode/bin/python3 -c \
            'import rebel; print(f"rebel import OK: {rebel.__file__}")'

      - name: Run disaggregated P/D
        id: run
        shell: bash
        env:
          VLLM_LOGGING_LEVEL: DEBUG
        run: |
          set -euo pipefail
          log_dir="${{ github.workspace }}/pdd_logs/disaggregated-pdd"
          python3 run_pdd_once.py \
            --ready-timeout-sec 1200 \
            --log-dir "${log_dir}"

          decode_log="${log_dir}/decode.log"
          response_json="${log_dir}/completion_response.json"
          test -s "${decode_log}"
          test -s "${response_json}"

          if ! grep -Fq "Converting external KV for" "${decode_log}"; then
            echo "RBLN decode log does not confirm an external KV transfer" >&2
            exit 1
          fi

      - name: "[HUD] Report"
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          HUD="python3 ${RUNNER_TEMP}/hud_report.py"
          $HUD job build pdd "${{ steps.prepare.outcome }}"
          $HUD job correctness pdd "${{ steps.run.outcome }}"
          if [ "${{ steps.prepare.outcome }}" = failure ]; then
            $HUD failure pdd build --summary "Preparing the environments failed (see CI log)"
          elif [ "${{ steps.run.outcome }}" = failure ]; then
            $HUD failure pdd correctness --summary "Disaggregated P/D run failed (see CI log)"
          fi
          $HUD finish "${{ job.status == 'success' && 'success' || 'failure' }}"

      - name: Upload disaggregated P/D
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disaggregated-pdd
          path: pdd_logs/disaggregated-pdd/
          if-no-files-found: warn
          retention-days: 14
